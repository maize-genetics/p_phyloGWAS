# Reproduces the author's actual working "pytorch-2-1" conda environment, used for all
# python/LLM work in this project (ESM2/PlantCAD zero-shot scoring in
# notebook/07_summaryStats, plus general jupyter/analysis tooling). Exported via
# `conda env export -n pytorch-2-1 --no-builds` and hand-corrected for two packages whose
# conda-recorded pip metadata had drifted from the actually-installed version (accelerate,
# tqdm). Requires an NVIDIA GPU with a driver supporting CUDA 11.8 (pytorch-cuda=11.8).
