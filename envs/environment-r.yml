name: phyloGWAS-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.2            # confirmed with author: matches the R build the licensed ASReml-R
                          # tarball (src/asreml_4.2.0.355_linux-intel64_R4.2.0.tar.gz) targets

  # CRAN packages (r-* on conda-forge/bioconda)
  - r-ape
  - r-data.table
  - r-doparallel
  - r-dplyr
  - r-geiger
  - r-ggplot2
  - r-phangorn
  - r-phytools
  - r-qqman
  - r-reticulate
  - r-rphast
  - r-taxize
  - r-testthat
  - r-tidyr
  - r-tidyverse
  - r-bglr
  - r-canprot
  - r-cowplot
  - r-desctools
  - r-ggnewscale
  - r-ggridges
  - r-glmnet
  - r-gridextra
  - r-jsonlite
  - r-lsd
  - r-patchwork
  - r-pheatmap
  - r-phylolm
  - r-plyr
  - r-prroc
  - r-raster
  - r-reshape2
  - r-rjson
  - r-scales
  - r-stringr
  - r-terra
  - r-upsetr
  - r-viridis
  - r-xgboost
  - r-rgbif
  - r-bien

  # Bioconductor packages (bioconductor-* on bioconda)
  - bioconductor-biostrings
  - bioconductor-limma
  - bioconductor-msa2dist  # needed by src/07B_getOmega2Ref.R (stage 07 dN/dS). If your conda
                           # config has an "r" channel active (not listed here, but easy to
                           # pick up from a global .condarc), its r-stringi build can get
                           # pulled in ahead of conda-forge's and links against an ICU version
                           # older than what the rest of this env resolves to, breaking
                           # anything depending on stringr (including MSA2dist) with
                           # "unable to load ... libicui18nXX.so". Fix: force a conda-forge
                           # build explicitly, e.g. `conda install "conda-forge::r-stringi=1.8.4"`
                           # (confirmed via real-data testing of src/07B_getOmega2Ref.R)
  - bioconductor-rtracklayer
  - bioconductor-treeio
  - bioconductor-ggtree
  - bioconductor-topgo
  # bioconductor-ggtree pins to 3.6.0 for r-base=4.2, but conda-forge's r-tidytree for r42
  # only goes back to 0.4.5-0.4.6 - both renamed an internal helper (offspring.tbl_tree_item
  # -> .offspring.tbl_tree_item) that ggtree 3.6.0's geom_cladelab() still calls under the
  # old name, so tree-overlay figures (06C) fail with "could not find function
  # offspring.tbl_tree_item" until tidytree is downgraded post-install:
  #   R -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/tidytree/tidytree_0.4.2.tar.gz", repos=NULL, type="source")'
  # (confirmed via real-data testing of 06C_visualizationEnvAdapt.ipynb)

# NOT included (licensed, per author instruction — install manually, see README.md
# "Licensed software" section):
#   - asreml       4.2.0.355 installed in this env (2026-09-14), now vendored at
#                    src/asreml_4.2.0.355_linux-intel64_R4.2.0.tar.gz, replacing the older
#                    src/asreml_4.2.0.302_linux-intel64_R4.2.0.tar.gz -- author's call, since 302
#                    was flagged as the outdated installer. See the corrected root-cause note
#                    below: the asreml *build* was never actually the blocker.
#   - asremlPlus   4.4.40  <- PIN THIS VERSION. Do not take whatever CRAN offers.
#
# vpc.char DEAD END, ROOT CAUSE FOUND (added 2026-08-24, corrected 2026-09-14 -- the two prior
# rounds of debugging chased the wrong culprit; read this version, not the version-pin story
# below which is now known to be a red herring):
#   Real per-OG fits intermittently died with
#       Error : 'vpc.char' is not an exported object from 'namespace:asreml'
#   (or, depending on the exact model formula, a scoping error like "object 'fullFM' not found").
#   This looked like an asreml/asremlPlus version incompatibility (vpc.char is an asreml-internal
#   helper that a couple of asremlPlus's own code paths call) and two earlier debugging rounds
#   chased it that way -- pinning asremlPlus to 4.4.40, then concluding the asreml *build* itself
#   needed to be >= 4.2.0.355. Both of those were necessary-looking but insufficient, and on
#   2026-09-14 direct reproduction showed the asreml build was never the actual blocker: a real
#   asreml 4.2.0.355 installer (see above) hits the exact same failure, and even asreml 4.2.0.302
#   (the old vendored tarball) works fine once the real fix is applied.
#
#   The real mechanism: src/12_runPermulation_perOGModel.R calls
#   infoCriteria(model, IClikelihood = "full"), and asremlPlus::infoCriteria.asreml() only needs
#   vpc.char on an old-style (pre-4.2) asreml session -- on a real 4.2.x build it's supposed to
#   take a different branch entirely (using the model object's own $vparameters.con field). But
#   that branch is only reached once `Cfixed` is already present on the fitted model; if it's
#   NULL, infoCriteria() first calls asreml::update.asreml(model, maxit = 1) to compute it, and
#   THAT lazy refit re-evaluates the model's original asreml() call in a different R environment
#   than the one it was built in. In this pipeline's mclapply-forked, formula-built-via-paste0()
#   setup, that re-evaluation doesn't reliably see the right local variables/session state, and
#   depending on the exact model shape, it either can't find a formula variable, or falls through
#   into the vpc.char code path even on a modern asreml build. This is a real per-OG fit failure
#   (empirically confirmed on 3 different real OGs across 3 different asreml/env combinations,
#   see 12_runPermulation_perOGModel.R's fix commit), not something specific to one asreml build.
#
#   Fix (already applied in 12_runPermulation_perOGModel.R): set
#   `asreml.options(Cfixed = TRUE, gammaPar = FALSE)` BEFORE fitting each model, so Cfixed is
#   already populated when infoCriteria() runs and the lazy refit never happens. Verified
#   identical, clean per-OG results (same BIC to 4 decimal places) across all three of:
#     asreml 4.2.0.302 + asremlPlus 4.4.40   (this env, before the 2026-09-14 asreml upgrade)
#     asreml 4.2.0.355 + asremlPlus 4.4.40   (this env, after the 2026-09-14 asreml upgrade)
#     asreml 4.2.0.355 + asremlPlus 4.4.40   (the `daily` env on this machine)
#   -- i.e. the fix is what matters, not which of these particular asreml builds you're on. Two
#   OGs failed identically in all three combinations too (real non-convergence: "The estimation
#   was aborted; too many exceptions"), confirming the fix doesn't paper over genuine failures.
#   Note this also means the `daily` env was never actually a safe stopgap on its own -- without
#   the code fix it produces the exact same silent 0%-converged corruption as this env did.
#
#   asremlPlus is not on conda; install it into the env explicitly, from source, by version:
#     R -e 'install.packages(
#            "https://cran.r-project.org/src/contrib/Archive/asremlPlus/asremlPlus_4.4.40.tar.gz",
#            repos = NULL, type = "source")'
#   (pulls in devtools/qqplotr/tryCatchLog as hard Imports, which on this machine needed the
#   system gcc/g++/gfortran/binutils symlinked under their expected x86_64-conda-linux-gnu-*
#   names, since conda's own compiler toolchain isn't installed in this env — see git history
#   around 2026-09-14 if that's still not resolved some other way by the time you read this)
#   then confirm the pairing actually works rather than assuming it -- NOT by checking whether
#   vpc.char resolves (that was the wrong test, see above; it can be FALSE on a perfectly working
#   modern asreml build and the pipeline still runs fine as long as the Cfixed fix is in place):
#     R -e 'library(asremlPlus); packageVersion("asremlPlus")'
#   instead, do a real per-OG smoke test with Cfixed set up front (see fit_model_v4() in
#   12_runPermulation_perOGModel.R) and confirm it returns a real BIC instead of erroring.
#   See DECISIONS.md #45 in p_lifeHistoryPoaceae for the original (now superseded) diagnosis.
#
# A few of the r-* names above (r-canprot, r-rphast, r-bien) are lower-traffic CRAN
# packages that may not resolve on every conda channel snapshot; if `conda env create`
# fails on one of them, install it from CRAN inside the env instead:
#   R -e 'install.packages(c("canprot","rphast","BIEN"), repos="https://cloud.r-project.org")'
